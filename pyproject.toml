[project]
name = "facerecserver"
version = "0.1.0"
description = "基于 PETALface (WACV 2025) 算法的人脸识别 API 服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "python-multipart>=0.0.6",
    "facenet-pytorch>=2.6",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "huggingface-hub>=0.20",
    "timm>=0.9",
    "requests>=2.31",
    "faiss-cpu>=1.7",
    "pyiqa>=0.1.15.post2",
]

[tool.setuptools.packages.find]
include = ["facerecserver", "facerecserver.*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]

[project.scripts]
facerecserver = "facerecserver.__main__:main"
