services:
  facerecserver:
    image: taplo/facerecserver:latest
    container_name: facerecserver
    ports:
      - "${PORT:-8001}:8000"
    volumes:
      - ./models:/app/models
      - ./gallery:/app/gallery
    environment:
      - TZ=Asia/Shanghai
      - MKL_CBWR=COMPATIBLE
      - MKL_ENABLE_INSTRUCTIONS=AVX
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
